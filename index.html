<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* A subtle gradient background so you can actually see the transparency effect */
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* See-through Sidebar */
        #sidebar {
            width: 260px;
            background-color: rgba(242, 242, 247, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 20;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 15px;
            color: #1c1c1e;
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px;
            background-color: rgba(11, 147, 246, 0.9);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
            backdrop-filter: blur(5px);
        }

        .new-chat-btn:hover {
            background-color: rgba(0, 122, 255, 1);
        }

        .chat-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            color: #3a3a3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background-color 0.2s;
        }

        .chat-item:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

        .chat-item.active {
            background-color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            color: #000;
        }

        .delete-chat {
            background: none;
            border: none;
            color: #8e8e93;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
        }

        .delete-chat:hover {
            color: #ff3b30;
        }

        /* Main See-through Chat Area */
        .main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #header {
            background-color: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            z-index: 10;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            background-color: #000;
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Chat history area */
        #chat-history {
            flex-grow: 1;
            padding: 24px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: transparent;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }

        .user-wrapper {
            align-self: flex-end;
            align-items: flex-end;
        }

        .ai-wrapper {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 12px 16px;
            font-size: 15px;
            line-height: 1.35;
            word-wrap: break-word;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .user-message {
            background-color: rgba(11, 147, 246, 0.85);
            color: white;
            border-radius: 20px 20px 4px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .ai-message {
            background-color: rgba(229, 229, 234, 0.75);
            color: black;
            border-radius: 20px 20px 20px 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Message Action Buttons (Copy / Edit) */
        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .user-wrapper:hover .message-actions,
        .ai-wrapper:hover .message-actions {
            opacity: 1;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.6);
            border: none;
            cursor: pointer;
            color: #555;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .action-btn svg {
            width: 14px;
            height: 14px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #0b93f6;
        }

        /* See-through Input Area */
        #input-container {
            display: flex;
            padding: 16px 20px 24px 20px;
            background-color: rgba(248, 248, 248, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .input-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 4px 6px 4px 16px;
            transition: border-color 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: rgba(11, 147, 246, 0.8);
            background-color: rgba(255, 255, 255, 0.85);
        }

        #user-input {
            flex-grow: 1;
            border: none;
            font-size: 15px;
            outline: none;
            padding: 8px 0;
            background: transparent;
            color: #1c1c1e;
        }

        .btn {
            background: rgba(255, 255, 255, 0.5);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            transition: all 0.2s ease;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            backdrop-filter: blur(5px);
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #0b93f6;
        }

        #action-btn-main {
            background-color: rgba(11, 147, 246, 0.9);
            color: white;
            margin-left: 8px;
        }

        #action-btn-main:hover {
            background-color: rgba(0, 122, 255, 1);
            color: white;
        }

        #action-btn-main svg {
            width: 16px;
            height: 16px;
        }

        #action-btn-main.stop-mode {
            background-color: rgba(255, 59, 48, 0.9);
        }

        #action-btn-main.stop-mode:hover {
            background-color: rgba(215, 0, 21, 1);
        }

        #mic-btn.recording {
            color: #ff3b30;
            background-color: rgba(255, 255, 255, 0.9);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); color: #ff453a; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <span>chat logs</span>
        </div>
        <div style="padding: 0 16px;">
            <button class="new-chat-btn" id="new-chat-btn">+ New Chat</button>
        </div>
        <div class="chat-list" id="chat-list">
            <!-- Chat history items populate here -->
        </div>
    </div>

    <!-- Main Chat Window -->
    <div class="main-container">
        <div id="header">
            <div class="avatar"> <img src="https://s3-new.macosicons.com/macosicons/parse/bob_eye_L160HvJKtL_lowResPng-db1b7f10d5.png" alt="Eye AI Avatar">
            </div>
            <div>Eye AI</div>
        </div>

        <div id="chat-history">
            <!-- Messages load here -->
        </div>

        <div id="input-container">
            <button id="mic-btn" class="btn" title="Click to Speak">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="22"></line>
                </svg>
            </button>
            
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="chat" autocomplete="off">
                <button id="action-btn-main" class="btn" title="Send">
                    <svg id="main-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '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';
        
        let chats = JSON.parse(localStorage.getItem('eye_ai_chats')) || [];
        let currentChatId = null;
        let isGenerating = false;
        let currentAbortController = null;

        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const actionBtnMain = document.getElementById('action-btn-main');
        const mainBtnIcon = document.getElementById('main-btn-icon');
        const micBtn = document.getElementById('mic-btn');
        const chatList = document.getElementById('chat-list');
        const newChatBtn = document.getElementById('new-chat-btn');

        function initApp() {
            if (chats.length === 0) {
                createNewChat("New Chat");
            } else {
                switchChat(chats[0].id);
            }
            renderChatList();
        }

        function createNewChat(title) {
            if (isGenerating) return;
            const newChat = {
                id: Date.now().toString(),
                title: title,
                messages: []
            };
            chats.unshift(newChat);
            saveChats();
            switchChat(newChat.id);
            renderChatList();
        }

        function switchChat(id) {
            if (isGenerating) return;
            currentChatId = id;
            renderChatList();
            renderCurrentChatMessages();
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            chats = chats.filter(c => c.id !== id);
            saveChats();
            if (chats.length === 0) {
                createNewChat("New Chat");
            } else if (currentChatId === id) {
                switchChat(chats[0].id);
            } else {
                renderChatList();
            }
        }

        function saveChats() {
            localStorage.setItem('eye_ai_chats', JSON.stringify(chats));
        }

        function renderChatList() {
            chatList.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.onclick = () => switchChat(chat.id);
                
                const titleSpan = document.createElement('span');
                titleSpan.textContent = chat.title;
                item.appendChild(titleSpan);

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-chat';
                delBtn.textContent = '×';
                delBtn.onclick = (e) => deleteChat(chat.id, e);
                item.appendChild(delBtn);

                chatList.appendChild(item);
            });
        }

        function renderCurrentChatMessages() {
            chatHistory.innerHTML = '';
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat || chat.messages.length === 0) {
                appendUIMessage("Hello. Eye AI is active. Type below or speak to begin.", false);
                return;
            }

            chat.messages.forEach((msg, index) => {
                appendUIMessage(msg.content, msg.role === 'user', index);
            });
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                micBtn.classList.add('recording');
                userInput.placeholder = "Listening...";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript; 
            };

            recognition.onerror = () => {
                micBtn.classList.remove('recording');
                userInput.placeholder = "iMessage";
            };

            recognition.onend = () => {
                micBtn.classList.remove('recording');
                userInput.placeholder = "iMessage";
            };

            micBtn.addEventListener('click', () => {
                recognition.start();
            });
        } else {
            micBtn.style.display = 'none';
        }

        function appendUIMessage(text, isUser, messageIndex = null) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${isUser ? 'user-wrapper' : 'ai-wrapper'}`;

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            msgDiv.textContent = text;
            wrapper.appendChild(msgDiv);

            if (isUser && messageIndex !== null) {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';

                const copyBtn = document.createElement('button');
                copyBtn.className = 'action-btn';
                copyBtn.title = 'Copy';
                copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
                copyBtn.onclick = () => navigator.clipboard.writeText(text);
                actionsDiv.appendChild(copyBtn);

                const editBtn = document.createElement('button');
                editBtn.className = 'action-btn';
                editBtn.title = 'Edit Prompt';
                editBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
                editBtn.onclick = () => editPrompt(messageIndex);
                actionsDiv.appendChild(editBtn);

                wrapper.appendChild(actionsDiv);
            }

            chatHistory.appendChild(wrapper);
            scrollToBottom();
            return msgDiv;
        }

        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function setGeneratingState(active) {
            isGenerating = active;
            if (active) {
                actionBtnMain.classList.add('stop-mode');
                actionBtnMain.title = 'Stop Generating';
                mainBtnIcon.innerHTML = `<rect x="6" y="6" width="12" height="12" fill="currentColor"></rect>`;
            } else {
                actionBtnMain.classList.remove('stop-mode');
                actionBtnMain.title = 'Send';
                mainBtnIcon.innerHTML = `<line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline>`;
            }
        }

        async function handleMainAction() {
            if (isGenerating) {
                if (currentAbortController) {
                    currentAbortController.abort();
                }
                setGeneratingState(false);
                return;
            }

            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            const chat = chats.find(c => c.id === currentChatId);
            
            if (chat.messages.length === 0) {
                chat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
                renderChatList();
            }

            chat.messages.push({ role: 'user', content: text });
            saveChats();
            renderCurrentChatMessages();

            await triggerAIResponse(chat);
        }

        async function editPrompt(index) {
            if (isGenerating) return;
            const chat = chats.find(c => c.id === currentChatId);
            const targetMessage = chat.messages[index];
            
            userInput.value = targetMessage.content;
            chat.messages = chat.messages.slice(0, index);
            saveChats();
            renderCurrentChatMessages();
            userInput.focus();
        }

        async function triggerAIResponse(chat) {
            setGeneratingState(true);
            currentAbortController = new AbortController();

            const aiBubble = appendUIMessage('', false);
            chat.messages.push({ role: 'assistant', content: '' });

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: chat.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content })),
                        model: "groq/compound",
                        temperature: 1,
                        max_tokens: 2048,
                        stream: true
                    }),
                    signal: currentAbortController.signal
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.choices[0].delta.content) {
                                    fullContent += data.choices[0].delta.content;
                                    aiBubble.textContent = fullContent;
                                    chat.messages[chat.messages.length - 1].content = fullContent;
                                    saveChats();
                                    scrollToBottom();
                                }
                            } catch (e) {
                                console.error('Parsing error', e);
                            }
                        }
                    }
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    aiBubble.textContent = 'Connection error: ' + error.message;
                }
            } finally {
                setGeneratingState(false);
                currentAbortController = null;
            }
        }

        actionBtnMain.addEventListener('click', handleMainAction);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isGenerating) {
                handleMainAction();
            }
        });
        newChatBtn.addEventListener('click', () => createNewChat("New Chat"));

        initApp();
    </script>
</body>
</html>
